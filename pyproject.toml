[project]
name = "marcus"
version = "2.7.8"
description = "Marcus is a LLM based ranking UI"
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi>=0.116.1",
    "gunicorn>=23.0.0",
    "httpx[http2]>=0.28.1",
    "opentelemetry-api>=1.36.0",
    "opentelemetry-exporter-otlp>=1.36.0",
    "opentelemetry-exporter-prometheus>=0.57b0",
    "opentelemetry-instrumentation-fastapi>=0.57b0",
    "opentelemetry-sdk>=1.36.0",
    "prometheus-client>=0.22.1",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "python-jose>=3.5.0",
    "tenacity>=9.1.2",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "jinja2>=3.1.6",
    "pre-commit>=4.2.0",
    "pre-commit-hooks>=5.0.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.4",
    "ruff>=0.12.7",
]
poc = [
    "ipykernel>=6.30.0",
]
test = [
    "coverage>=7.10.1",
    "docker>=7.1.0",
    "playwright>=1.54.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "pytest-env>=1.1.5",
    "pytest-nlcov>=0.4.0",
    "pytest-randomly>=3.16.0",
    "pytest-testmon>=2.1.3",
    "testcontainers>=4.12.0",
]
