[project]
name = "marcus"
version = "2.7.8"
description = "Marcus is a LLM based ranking UI"
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi>=0.116.1",
    "gunicorn>=23.0.0",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.36.0",
    "opentelemetry-exporter-otlp>=1.36.0",
    "opentelemetry-instrumentation-fastapi>=0.57b0",
    "opentelemetry-sdk>=1.36.0",
    "pydantic-settings>=2.10.1",
    "python-jose>=3.5.0",
    "tenacity>=9.1.2",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "jinja2>=3.1.6",
    "pyyaml>=6.0.2",
    "requests>=2.32.4",
]
poc = [
    "ipykernel>=6.30.0",
]
test = [
    "coverage>=7.10.1",
    "playwright>=1.54.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-env>=1.1.5",
    "pytest-nlcov>=0.4.0",
    "ruff>=0.12.7",
]
